services:
  app:
    build: .
    image: veille-laravel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Local uniquement : en prod, l'accès public passe par Caddy (HTTPS).
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      APP_NAME: Veille
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:-}
      APP_LOCALE: fr
      API_TOKEN: ${API_TOKEN:?Définissez API_TOKEN dans le fichier .env}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-veille}
      DB_USERNAME: ${DB_USERNAME:-veille}
      DB_PASSWORD: ${DB_PASSWORD:?Définissez DB_PASSWORD dans le fichier .env}
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-veille}
      MARIADB_USER: ${DB_USERNAME:-veille}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Définissez DB_PASSWORD dans le fichier .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
